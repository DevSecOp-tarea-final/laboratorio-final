name: Worlflow

on:
  
  push:
   branches:
    - pipeline

jobs:
  
  SAST: 
    runs-on: ubuntu-latest
    steps:

      - name: Set up JDK 17
        uses: actions/setup-java@v4.5.0
        with: 
          java-version: '17'
          distribution: 'adopt'
      - name: creando proyecto en sonarcloud
        run: |
          curl -f -X POST -u '${{ secrets.SONAR_TOKEN }}:' "https://sonarcloud.io/api/projects/create" -d 'name=${{ github.event.repository.name }}' -d 'organization=tareafinal' -d 'visibility=public'