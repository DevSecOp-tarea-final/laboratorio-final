name: Worlflow

on:
  
  push:
   branches:
    - pipeline

jobs:
  
  SAST: 
    runs-on: ubuntu-24.04
    steps:

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4.5.0
        with: 
          java-version: '17'
          distribution: 'adopt'

      - name: Install SonarCloud scanner
        run: |
          curl -sSLo sonar-scanner-cli.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-4.7.0.2747.zip
          unzip sonar-scanner-cli.zip
          export PATH=$(pwd)/sonar-scanner-4.7.0.2747-linux/bin:$PATH

      - name: Run SonarCloud scanner
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
          SONAR_PROJECT_KEY: pet-clinic
          SONAR_ORGANIZATION: tareafinal
        run: |
          sonar-scanner \
            -Dsonar.projectKey=$SONAR_PROJECT_KEY \
            -Dsonar.organization=$SONAR_ORGANIZATION \
            -Dsonar.sources=./ \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=$SONAR_TOKEN

          
      - name: creando proyecto en sonarcloud
        run: |
          curl -u ${{ secrets.SONARCLOUD_TOKEN }}: \
            -X POST \
            'https://sonarcloud.io/api/projects/create' \
            -d "name=${{ github.event.repository.name }}" \
            -d "project=pet-clinic" \
            -d "organization=tareafinal"